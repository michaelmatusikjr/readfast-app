<style>
/* Layout: one-screen phone app. Library-level views scroll above a tab bar; the reader is a full-bleed page
   with thin top and bottom control bars that fade away in focus mode. */
[hidden]:not([hidden=until-found i]){display:none!important}
:root{
  --paper:#E9EDF2; --surface:#FFFFFF; --raise:#F4F6F9; --ink:#15202D; --muted:#5A6779;
  --line:#CED6E0; --accent:#2244B5; --accent-soft:#DCE4FA; --accent-ink:#FFFFFF; --danger:#B3262F;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --focus:#E0303F; --rfont:var(--f-ui); --rsize:44px;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --img-bg:#FFFFFF; /* book art is drawn for white pages, so images keep a white ground in every theme */
  /* page (reader) tokens: JS sets these from the chosen reading theme */
  --page-bg:#FFFFFF; --page-ink:#1B1B1B; --page-muted:#6B6B6B; --page-line:#E2E2E2; --page-link:#2456C7;
  --hl1:#FFE58A; --hl2:#C4EDB5; --hl3:#C5E1FF; --hl4:#FFC9DF; --tts:#FFD54A;
  --bfont:"Literata",Georgia,serif; --bsize:19px; --blh:1.55; --mx:24px; --pgap:.6em; --pind:0; --balign:left; --hyph:manual; --bw:400; --bwb:700;
}
:root[data-theme="dark"]{
  --paper:#0E1217; --surface:#171C23; --raise:#1E242C; --ink:#E4E9F0; --muted:#8D99A8;
  --line:#2B333D; --accent:#8AA4FF; --accent-soft:#232E4D; --accent-ink:#0E1217; --danger:#FF7A82; color-scheme:dark;
  --hl1:#FFE14D; --hl4:#FF9EC8}
*{box-sizing:border-box}
html,body{height:100%;touch-action:pan-x pan-y} /* no pinch or double-tap zoom of the app; pictures have their own zoom */
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{overflow:hidden}
#app{position:fixed;inset:0;height:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* Reader is full-bleed: the header, not #app, clears the notch, so the top inset is not applied twice. */
#app:has(#v-reader:not([hidden])){padding-top:0}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.15rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;cursor:pointer;color:inherit;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:rgba(127,127,127,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}

/* Library */
#libTools{display:flex;flex-direction:column;gap:10px;width:100%}
.libbar{display:flex;gap:8px;align-items:center}
#libFind{flex:1;min-width:0;box-sizing:border-box}
.tbtn{flex:none;position:relative;width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbtn.on{border-color:var(--accent);color:var(--sel-ink,var(--accent))}
#libSug,#libPills{gap:6px}
#libPills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:2px}
#libPills::-webkit-scrollbar{display:none}
.tagchips .chip{padding:5px 10px;font-size:.82rem;border-radius:999px}
/* filter colors: status, title, author, tag — colour via tint, border and dot; label text is always --ink */
.pill{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);max-width:100%}
.pill .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.pill .x{font-size:.7rem;opacity:.7;color:var(--ink)}
.pill .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);font-weight:700}
.pill span.v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.f-st{--c:#2f9e6e}.f-ti{--c:#3a6fd8}.f-au{--c:#c47a12}.f-tg{--c:#9b4dca}
.pill.clear{--c:var(--muted);font-weight:500}
.pill.ftpill{--c:var(--ink)}
#libPills .pill{flex:none;min-height:44px;padding:0 12px 0 10px;max-width:min(80vw,20rem)}
button.hlrow.ftrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.ftrow mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.wn-i{padding:10px 0;border-bottom:1px solid var(--line)}.wn-i:last-child{border:0}.wn-i .small{margin-top:3px;line-height:1.45}
.wn{margin-bottom:14px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent-text,var(--accent));text-decoration:underline;cursor:pointer}
details.yr{margin-top:10px}
.fsec{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.fsec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700}
.fsec summary::-webkit-details-marker{display:none}
.fsec summary .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.fsec summary .n{margin-left:auto;font-weight:500;color:var(--muted);font-size:.85rem}
.fsec summary .chev{transition:transform .15s;color:var(--muted)}
.fsec[open] summary .chev{transform:rotate(90deg)}
.fsec .fin{margin:0 12px 8px;width:calc(100% - 24px);box-sizing:border-box}
.fsec .fopts{max-height:260px;overflow:auto;padding:0 6px 8px}
.fopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 8px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;border-radius:8px}
.fopt .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.fopt .bx{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--surface)}
.fopt[aria-pressed=true] .bx{background:var(--c);border-color:var(--c)}
.fopt .lb{flex:1;min-width:0}.fopt .ct{color:var(--muted);font-size:.8rem}
.sortopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left}
.sortopt[aria-pressed=true]{border-color:var(--accent);color:var(--sel-ink,var(--accent))}
.grp{margin:10px 2px -2px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.grp span{font-weight:400;letter-spacing:0}
.doc .a{grid-column:1;font-size:.9rem;color:var(--ink);opacity:.8;margin-top:-2px}
.doc .tg{grid-column:1;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.doc .tg span{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagchips .chip .x{margin-left:6px;opacity:.6}
.addopt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.addopt svg{flex:none;width:26px;height:26px;color:var(--accent)}
.addopt b{display:block;font-size:1rem}.addopt small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
:root{--fill:color-mix(in srgb, var(--accent) 16%, var(--surface))}
.doc{background:linear-gradient(90deg,var(--fill) 0,var(--fill) var(--p,0%),var(--surface) var(--p,0%)) !important}
/* OpenDyslexic (SIL Open Font License) ships with the app so it works offline */
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Bold-Italic.woff2') format('woff2');font-weight:700;font-style:italic;font-display:swap}
 /* on touch screens Tooz does its own selection in a book, so the phone's Copy / Look Up menu stays out of the way */
@media (hover:none),(pointer:coarse){ #pagesView,#scFlow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} }
.book w.tsel,.book wd.tsel{--hc:color-mix(in srgb,var(--accent) 32%,transparent)}
.tsdrag #selBar{opacity:0;pointer-events:none}
.tsh{position:fixed;z-index:13;width:32px;height:calc(var(--stem,22px) + 16px);margin-left:-16px;touch-action:none;cursor:grab}
.tsh::before{content:"";position:absolute;left:15px;width:2px;height:var(--stem,22px);background:var(--accent)}
.tsh::after{content:"";position:absolute;left:9px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
#tsA::after{top:0} #tsA::before{top:13px}
#tsB::before{top:0} #tsB::after{top:calc(var(--stem,22px) - 1px)}
.qcard-prev{width:100%;max-width:360px;aspect-ratio:1;display:block;margin:0 auto 12px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.tdet{margin-top:12px}
.tdet summary{cursor:pointer;color:var(--muted);font-size:.85rem;list-style:none;display:flex;align-items:center;gap:6px}
.tdet summary::-webkit-details-marker{display:none}
.tdet summary::before{content:"›";display:inline-block;transition:transform .15s}
.tdet[open] summary::before{transform:rotate(90deg)}
.tdet summary span{opacity:.75}
#tagSet .tdet{margin-top:0}#tagSet .tdet summary{font-size:.95rem;color:var(--ink);font-weight:600;padding:2px 0}
#tagSet .tdet .list{margin-top:10px}
.book w.nb{color:var(--link,var(--accent));text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.stars{display:flex;gap:4px;margin-top:4px}
.stars button{font-size:2rem;line-height:1;background:none;border:0;color:var(--accent);padding:2px 4px;cursor:pointer}
.winner .wdel{flex:none;align-self:center;color:var(--muted)}
.winner .wdel:hover{color:var(--danger)}
.hint-touch{display:inline}.hint-mouse{display:none}
@media (hover:hover) and (pointer:fine){ .hint-touch{display:none}.hint-mouse{display:inline} }
/* only a book's own text can be selected */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],#pagesView,#scFlow,.lookup,#sheet .quote{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.doc{display:grid;grid-template-columns:1fr auto;gap:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px 14px 16px;cursor:pointer;text-align:left}
.doc .t{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.doc .m{grid-column:1;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.doc .bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--raise);overflow:hidden;margin-top:6px;margin-right:8px}
.doc .bar i{display:block;height:100%;background:var(--accent)}
.doc .more{grid-row:1/3;grid-column:2;align-self:center}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Tabs */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
#tabs button{border:0;background:none;padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;min-height:56px}
#tabs button svg{width:22px;height:22px}
#tabs button[aria-current="page"]{color:var(--sel-ink,var(--accent))}
#tabs button[aria-current="page"] svg{color:var(--accent)}

/* ---------- Reader frame ---------- */
#v-reader{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--page-bg);color:var(--page-ink)}
.rchrome{flex:none;transition:opacity .2s ease,visibility .2s ease;background:var(--page-bg);position:relative;z-index:5}
#v-reader.chrome-off .rchrome{opacity:0;visibility:hidden;pointer-events:none}
#rTop{display:flex;align-items:center;gap:0;padding:max(2px,env(safe-area-inset-top,0px)) max(4px,env(safe-area-inset-right,0px)) 2px max(4px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--page-line)}
#rTop .r-spacer{flex:1;min-width:0}
#rTop .r-ident{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#rAa{font-family:Georgia,serif;font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
#rBody{flex:1;min-height:0;position:relative;overflow:hidden}
#rFoot{display:flex;flex-direction:column;gap:4px;padding:8px max(8px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-top:1px solid var(--page-line)}
#v-reader[data-mode="speed"] #rFoot{display:none}
.rfoot-row{display:flex;align-items:center;gap:4px}
.rfoot-row .info{flex:1;min-width:0;border:0;background:none;color:var(--page-muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:6px 2px}
#rMark.on svg path{fill:currentColor}
.run{position:absolute;left:0;right:0;z-index:4;text-align:center;font-size:.72rem;color:var(--page-muted);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 56px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#runHead{top:env(safe-area-inset-top,0px);height:14px;line-height:14px}
#runFoot{bottom:env(safe-area-inset-bottom,0px);height:16px;line-height:16px}
#v-reader.chrome-off .run{opacity:1}
#v-reader[data-mode="speed"] .run{display:none}

/* Quiet Speed: chrome fades while playing, stays tappable, wakes on touch */
#v-reader.speed-playing #rTop,
#v-reader.speed-playing #context,
#v-reader.speed-playing #stageHint,
#v-reader.speed-playing #pauseTools,
#v-reader.speed-playing #speedView .scrub,
#v-reader.speed-playing #speedView .controls,
#v-reader.speed-playing #speedView .speed{
  opacity:.15;transition:opacity .3s ease;
}
#v-reader.speed-playing.speed-awake #rTop,
#v-reader.speed-playing.speed-awake #context,
#v-reader.speed-playing.speed-awake #stageHint,
#v-reader.speed-playing.speed-awake #pauseTools,
#v-reader.speed-playing.speed-awake #speedView .scrub,
#v-reader.speed-playing.speed-awake #speedView .controls,
#v-reader.speed-playing.speed-awake #speedView .speed{
  opacity:1;
}
#v-reader.speed-playing #pauseTools{min-height:0}
@media (prefers-reduced-motion: reduce){
  #v-reader.speed-playing #rTop,
  #v-reader.speed-playing #context,
  #v-reader.speed-playing #stageHint,
  #v-reader.speed-playing #pauseTools,
  #v-reader.speed-playing #speedView .scrub,
  #v-reader.speed-playing #speedView .controls,
  #v-reader.speed-playing #speedView .speed{transition:none}
}


/* Auto-scroll bar */
#asBar{display:flex;align-items:center;gap:4px}
/* Floating read-aloud pill (play/pause + speed chip). Voice is a long-press; skip is a swipe. */
#ttsBar{position:absolute;left:50%;transform:translateX(-50%);z-index:13;display:flex;align-items:center;gap:2px;width:max-content;max-width:calc(100% - 24px);padding:4px 4px 8px 4px;border-radius:32px;background:color-mix(in srgb,var(--page-bg) 94%,var(--page-ink));color:var(--page-ink);border:1px solid var(--page-line);box-shadow:0 4px 18px rgba(0,0,0,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);touch-action:none;pointer-events:auto;bottom:calc(12px + var(--rfoot-h,96px))}
#v-reader[data-mode="speed"] #ttsBar{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#ttsBar .icon-btn.play{width:48px;height:48px;flex:none;border-radius:50%;background:var(--play-bg,var(--accent));color:var(--play-ink,var(--accent-ink,#fff))}
#ttsSpeed{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 12px;border-radius:22px;font:600 15px/1.15 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:var(--page-ink);cursor:pointer}
#ttsLabel{font:inherit;color:inherit}
#ttsTrack{position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:1px;background:color-mix(in srgb,var(--page-ink) 16%,transparent);overflow:hidden;pointer-events:none}
#ttsTrack>i{display:block;height:100%;width:0;background:var(--accent);border-radius:1px}

.lookup{font-family:var(--rfont);font-size:2.6rem;text-align:center;padding:18px 8px;border:1px solid var(--line);border-radius:14px;background:var(--raise);-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;cursor:text;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--sel-ink,var(--accent))}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.note{font-size:.88rem;color:var(--muted);line-height:1.5}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
code{font-family:var(--f-mono);font-size:.85em;background:var(--raise);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.quote{font-family:var(--bfont);font-size:1rem;line-height:1.5;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink);overflow-wrap:anywhere}
.result{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer;color:var(--ink);font-size:.92rem;line-height:1.45}
.result mark{background:var(--accent-soft);color:var(--sel-ink,var(--accent));font-weight:700;border-radius:3px;padding:0 1px}
.result .where{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.nbook{border:1px solid var(--line);border-radius:14px;padding:10px 14px 4px;background:var(--surface);min-width:0;max-width:100%;box-sizing:border-box}
.nbook .nt{background:var(--raise)}
#notesHl,#notesBm,#wordsPane{width:100%;min-width:0}
.nbook-h .btn{flex:none}
.nbook-h{display:flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.nbook-h b{flex:1;min-width:0;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbook-h .small{color:var(--muted);font-size:.78rem}
.nbook .hlrow:last-child{border-bottom:0}
.hlrow{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0}
.moment-dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:8px;box-shadow:0 0 0 1px var(--line);opacity:1;background:var(--hl1)}
.moment-go{all:unset;flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;text-align:left;color:inherit;font:inherit}
.moment-more{flex:none}
.hl-tools{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.hl-meta{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);min-height:44px}
.hl-meta .sort{margin-left:auto;background:none;border:0;color:var(--accent-text,var(--accent));font:inherit;font-weight:700;cursor:pointer;min-height:44px;padding:0 6px}
.nbook-toggle{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.nbook-toggle .chev{flex:none;color:var(--muted)}
#notesHlTools{width:100%;min-width:0;margin:0 0 10px}
.nbook-title{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbook-count{flex:none;color:var(--muted);font-size:.82rem}
.moment-ico{flex:none;width:22px;height:22px;margin-top:3px;color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.moment-ico svg{width:20px;height:20px}
.moment-kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.moment-rm,.moment-more{flex:none;min-width:44px;min-height:44px}
.moment-row .swfront{background:var(--surface)}
/* swipe left on a row to reveal Delete, with Undo */
.swrow{position:relative;overflow:hidden}
.swrow .swdel{position:absolute;top:0;right:0;bottom:1px;width:92px;border:0;background:var(--danger);color:#fff;font:inherit;font-weight:600}
.swrow .swfront{position:relative;background:var(--paper);transition:transform .2s ease;touch-action:pan-y}
.swrow.dragging .swfront{transition:none}
.hlrow .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.hlrow .grow{flex:1;min-width:0;cursor:pointer}
.hlrow .t{font-family:var(--bfont);font-size:.95rem;line-height:1.45;overflow-wrap:anywhere}
.hlrow .nt{font-size:.85rem;color:var(--ink);margin-top:4px;background:var(--raise);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere}
.hlrow .where{font-size:.75rem;color:var(--muted);margin-top:3px}

/* Reading panel (Aa) */
.panel-sec{display:flex;flex-direction:column;gap:10px}
details.aadet{border-top:1px solid var(--line);padding:2px 0}
details.aadet>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 2px;font-weight:600;font-size:.98rem}
details.aadet>summary::-webkit-details-marker{display:none}
details.aadet>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:6px}
details.aadet[open]>summary::after{transform:rotate(-135deg)}
.aadet-b{display:flex;flex-direction:column;gap:12px;padding:0 0 14px}
.aaquick{gap:14px}
.aarow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aalbl{font-weight:600}
.fontrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fontrow button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fontrow button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--sel-ink,var(--accent))}
h3.subh{margin:16px 0 8px}
#rAs.on{color:var(--chrome-on,var(--page-link))}
.panel-sec>h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-ui);font-weight:700}
.themes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.themes button{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-family:Georgia,serif;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;padding:0}
/* Match phone: the Aa is two-tone like the swatch (day ink on the day half, Dark's ink on the dark half), so each half reads 4.5:1+ */
.themes button{position:relative}
.themes .aa2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:inherit}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.themes .aa2{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}}
.themes button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.themes .lbl{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.66rem;color:var(--muted);text-align:center;margin-top:-4px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-family:Georgia,serif;font-weight:700;color:var(--ink)}
.stepper .v{flex:1;text-align:center;font-family:var(--f-mono);font-size:.9rem;color:var(--accent-text,var(--accent))}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fontgrid .chip{text-align:center;padding:10px 6px;font-weight:600;font-size:1rem;min-width:0;overflow:hidden;overflow-wrap:anywhere;line-height:1.2}
.fontgrid .chip.wide{font-size:.78rem;letter-spacing:-.01em}
.fontgrid .chip small{display:block;font-family:var(--f-ui);font-weight:400;font-size:.68rem;color:var(--muted);margin-top:2px}
.timerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.timerow input{width:auto;padding:6px 8px}
.goalbar{height:10px;border-radius:5px;background:var(--raise);overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:5px}

body.tts-pill-on #toast{bottom:calc(168px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;font-size:.92rem;max-width:calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));box-shadow:0 6px 20px rgba(0,0,0,.25);flex-wrap:wrap}
#toast button{background:none;border:0;color:var(--paper);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
#toastProg{flex-basis:100%}

/* Words */
.wcard{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--danger)}
.wcard .del-under{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#fff;font-weight:700}
.winner{position:relative;background:var(--surface);padding:12px 8px 12px 16px;display:flex;gap:8px;align-items:flex-start;touch-action:pan-y;transition:transform .2s}
.winner.drag{transition:none}
.winner .grow{flex:1;min-width:0;cursor:pointer}
.winner .w{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.winner .s{font-size:.9rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.winner .s b{color:var(--ink)}
.winner .src{font-size:.75rem;color:var(--muted);margin-top:4px}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .v{font-family:var(--f-mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile .k{font-size:.8rem;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:10px;background:linear-gradient(var(--line),var(--line)) 0 100%/100% 1px no-repeat}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars .b i.zero{background:var(--line)}
.bars .b i.met{background:#2E9E5B}
.bars .b em{font-style:normal;font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.bars-x{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;text-align:center;font-size:.72rem;color:var(--muted)}

/* Settings rows */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;--accent-text:var(--accent-text-card,var(--accent))}
#sheet .group{background:var(--raise);--accent-text:var(--accent-text-raise,var(--accent-text-card,var(--accent)))}
.set{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.set .hd label{font-weight:700}
.set .val{font-family:var(--f-mono);font-size:.85rem;color:var(--accent-text,var(--accent));font-variant-numeric:tabular-nums;white-space:nowrap}
.set .desc{font-size:.84rem;color:var(--muted)}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--raise);padding:9px 4px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.big button{padding:11px 4px;font-size:.95rem}
input[type=color]{width:44px;height:44px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.dim{opacity:.45;pointer-events:none}
@media (prefers-reduced-motion: reduce){*{transition-property:opacity!important}} /* fades only: nothing moves */
/* phones: Tooz does its own selection in a book, so the phone's selection and menu stay off */
@media (hover:none),(pointer:coarse){ #pagesView,#pagesView *,#scFlow,#scFlow *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important} }

/* Continue reading hero + quieter shelf */
#v-library .continue-hero{
  display:grid;grid-template-columns:1fr auto;gap:4px 8px;
  /* !important beats .doc's fill (which uses --surface for the unfilled track) so the hero track stays --raise */
  background:linear-gradient(90deg,var(--fill) 0,var(--fill) var(--p,0%),var(--raise) var(--p,0%)) !important;
  border:1px solid var(--line);border-radius:16px;padding:18px 14px 16px 18px;
  margin:4px 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;text-align:left;
}
#v-library .continue-hero .eyebrow{grid-column:1;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#556274;font-weight:700;margin:0 0 4px}
#v-library .continue-hero .t{font-size:1.4rem;font-weight:700;line-height:1.25;margin:0;min-width:0;overflow-wrap:anywhere}
#v-library .continue-hero .a{grid-column:1;font-size:.95rem;color:var(--ink);opacity:.8;margin:2px 0 0}
#v-library .continue-hero .m{grid-column:1;font-size:.85rem;color:#556274;font-variant-numeric:tabular-nums;margin-top:2px}
:root[data-theme="dark"] #v-library .continue-hero .eyebrow,
:root[data-theme="dark"] #v-library .continue-hero .m{color:#919EAE}
#v-library .continue-hero .more{grid-row:1/3;grid-column:2;align-self:start}
#v-library .continue-hero .hero-go{grid-column:1/-1;min-height:44px;margin-top:12px;width:100%}
#v-library.lib-quiet #docList .doc:not(.continue-hero){padding:10px 8px 10px 14px;opacity:.8}
#v-library.lib-quiet #docList .doc:not(.continue-hero) .t{font-size:.95rem;font-weight:600}
#v-library.lib-quiet #docList .doc:not(.continue-hero) .a,#v-library.lib-quiet #docList .doc:not(.continue-hero) .m{font-size:.8rem;opacity:.85}
#v-library.lib-quiet #docList .doc.is-finished{opacity:.55}
#libSearchBtn{flex:none}
#libTools:not(.open) #libBar,#libTools:not(.open) #libSug{display:none}
#libTools .libtools-head{display:flex;justify-content:flex-end;align-items:center;min-height:44px}
#libTools.open .libtools-head{margin-bottom:2px}



/* Debug stamp stays in the DOM for release checks, but is never shown */
#htmlVer{display:none!important}

/* Version chip: 44px hit area (invisible padding), z-index below #backdrop/#sheet; hidden while a book is open */
#verBadge{position:fixed;top:max(0px,env(safe-area-inset-top,0px));right:max(0px,env(safe-area-inset-right,0px));z-index:15;min-width:44px;min-height:44px;padding:0;border:0;background:transparent;color:#fff;font:700 10px/1 system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
#verBadge .ver-chip{background:rgba(0,0,0,.7);padding:3px 7px;border-radius:6px;pointer-events:none}
body:has(#v-reader:not([hidden])) #verBadge{display:none}

/* Update bar sits above the tab bar, below sheets, and hides while a sheet is open */
#swUpdate{position:fixed;left:max(12px, calc(8px + env(safe-area-inset-left,0px)));right:max(12px, calc(8px + env(safe-area-inset-right,0px)));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--banner-bg,var(--accent));color:var(--banner-ink,var(--accent-ink,#fff));padding:12px 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 15px/1.3 system-ui,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.25)}
body:not(:has(#tabs[hidden])) #swUpdate{bottom:calc(56px + max(6px, env(safe-area-inset-bottom, 0px)) + 8px)}
body:has(#sheet:not([hidden])) #swUpdate{display:none}
body:has(#v-reader:not([hidden])) #swUpdate{display:none}
#swUpdate .sw-actions{display:flex;align-items:center;gap:8px;flex:none}
#swUpdate .sw-reload{background:var(--banner-ink,var(--accent-ink,#fff));color:var(--banner-bg,var(--accent));border:0;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;min-height:44px}
#swUpdate .sw-dismiss{background:transparent;color:var(--banner-ink,var(--accent-ink,#fff));border:0;width:44px;height:44px;padding:0;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
#swUpdate .sw-dismiss svg{width:20px;height:20px}


/* Notes stream: clamp long notes, word/bookmark rows, lazy list */
.nt-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.moment-go .t,.moment-go .nt,.moment-go .where{display:block;width:100%}
.moment-go .nt.nt-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.moment-go .moment-snip{display:none;width:100%}
.moment-row.open .moment-go .moment-snip{display:block}
.nt-more{display:block;align-self:flex-start;margin:2px 0 0;padding:0;border:0;background:none;color:var(--accent-text,var(--accent));font:inherit;font-weight:700;cursor:pointer;min-height:32px}
.moment-word{font-weight:700}
.moment-def{font-weight:500;color:var(--ink)}
.moment-snip{display:none;margin-top:4px;font-size:.85rem;color:var(--muted);line-height:1.4}
.moment-row.open .moment-snip{display:block}
.moment-exp{flex:none;min-width:44px;min-height:44px}

/* Tour */
#tour{position:fixed;inset:0;z-index:20000;font-family:var(--f-ui)}
#tourScrim{position:absolute;inset:0;background:rgba(10,12,16,.62);pointer-events:none}
#tourHole{position:absolute;box-shadow:0 0 0 9999px rgba(10,12,16,.62);background:transparent;pointer-events:none;z-index:1;border-radius:16px}
#tour.reduced #tourHole{box-shadow:0 0 0 9999px rgba(10,12,16,.7)}
/* with a spotlight, the hole's own shadow is the scrim, so the spotlit control shows at full colour (same darkness around it as before) */
#tour:has(#tourHole:not([hidden])) #tourScrim{background:transparent}
#tour:has(#tourHole:not([hidden])) #tourHole{box-shadow:0 0 0 9999px rgba(10,12,16,.86)}
#tour.reduced:has(#tourHole:not([hidden])) #tourHole{box-shadow:0 0 0 9999px rgba(10,12,16,.89)}
#tourSkip{position:absolute;top:calc(6px + var(--sat));right:calc(8px + var(--sar));z-index:5;min-width:44px;min-height:44px;padding:0 12px;border:0;background:rgba(20,22,26,.62);color:#fff;font:700 16px/1 var(--f-ui);cursor:pointer;border-radius:12px}
#tourCaption{position:absolute;left:calc(20px + var(--sal));right:calc(20px + var(--sar));z-index:5;color:#fff;font:700 1.15rem/1.35 var(--f-display);text-align:center;margin:0;padding:14px 16px;box-sizing:border-box;background:rgba(20,22,30,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#tourCaptionText{margin:0}
#tourSub{position:static;left:auto;right:auto;bottom:auto;z-index:auto;color:rgba(255,255,255,.9);font:500 .95rem/1.4 var(--f-ui);text-align:center;margin:8px 0 0;text-shadow:none}
#tourDots{position:absolute;left:50%;right:auto;transform:translateX(-50%);bottom:calc(76px + var(--sab));z-index:5;display:flex;justify-content:center;align-items:center;gap:7px;pointer-events:none;padding:8px 12px;background:rgba(20,22,30,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tour-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1.5px rgba(0,0,0,.65)}
.tour-dot.on,.tour-dot.done{background:#fff}
/* the current step: a longer dot in the app's accent, lifted toward white so it reads on the dark card in every Style and theme */
#tourDots .tour-dot.on{width:18px;border-radius:4px;background:color-mix(in srgb,var(--accent) 55%,#fff)}
[data-style="lively"] #tourDots .tour-dot.on{background:var(--accent)} /* Lively: the active step dot is full coral (≥3:1 on the dot card) */
.tour-pill-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sab));z-index:5;min-height:44px;min-width:120px;padding:0 22px;border:0;border-radius:22px;background:#fff;color:#111;font:700 16px/1 var(--f-ui);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.tour-pill-btn.primary{background:var(--accent);color:var(--accent-ink,#fff)}
#tourStart.primary{background:#fff;color:#111}

.tour-rtop.away{transform:translateY(-120%);opacity:0}

#tourPageB.in{animation:tourIn .8s ease-out}
@keyframes tourIn{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
#tourHoldWord.sel{background:var(--hl1);border-radius:2px;box-shadow:0 0 0 3px var(--hl1)}
#tourMid{position:absolute;left:26%;right:26%;top:28%;height:32%;bottom:auto;border-radius:16px}

#tourSel .dot[data-hl="1"]{background:var(--hl1)}
#tourSel .dot[data-hl="2"]{background:var(--hl2)}
#tourSel .dot[data-hl="3"]{background:var(--hl3)}
#tourSel .dot[data-hl="4"]{background:var(--hl4)}
#tourSel .sep{width:1px;height:20px;background:var(--line)}
#tourSel .tour-more{font-weight:700;padding:0 8px}
#tourPeek{position:absolute;left:12px;right:12px;top:calc(56px + var(--sat));z-index:4;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:16px 16px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:st-sheet calc(var(--motion-dur) * 2) var(--motion-ease)}
.tour-peek-row{padding:12px 10px;border-bottom:1px solid var(--line);font-weight:700}
#tourMoment{position:absolute;left:16px;right:16px;bottom:calc(116px + var(--sab));z-index:6;display:flex;gap:10px;align-items:flex-start;background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:st-pop var(--motion-dur) var(--motion-ease)}
#tourSpeedWord{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--bfont),Georgia,serif;font-size:2.4rem;font-weight:700;color:var(--page-ink,#1b1b1b);z-index:4}
#tourSpeedWord.flash{animation:tourFlash .8s ease-out}
@keyframes tourFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}40%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:1}}
#tourDemo.speed-on .tour-page,#tourDemo.speed-on #tourSel,#tourDemo.speed-on #tourPeek,#tourDemo.speed-on #tourMoment{display:none}
#tourPill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--rfoot-h,96px));z-index:6;display:flex;align-items:center;gap:2px;width:max-content;max-width:calc(100% - 24px);padding:4px 4px 8px 4px;border-radius:32px;background:color-mix(in srgb,var(--page-bg,#fff) 94%,var(--page-ink,#111));color:var(--page-ink,#111);border:1px solid var(--page-line,#ddd);box-shadow:0 4px 18px rgba(0,0,0,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#tourPill.glide{animation:tourGlide .8s ease-out}
@keyframes tourGlide{from{transform:translateX(-50%) translateY(24px);opacity:0}to{transform:translateX(-50%);opacity:1}}
#tourPill.breathe{animation:tourGlide .8s ease-out, tourBreathe .9s ease-out .8s}
@keyframes tourBreathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
#tourPill .tour-pill-play{width:48px;height:48px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink,#fff)}
#tourPill .tour-pill-play svg{width:24px;height:24px}
#tourPill .tour-pill-speed{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 12px;border-radius:22px;font:600 15px/1.15 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:var(--page-ink,#111)}
#tourPill .tour-pill-close{width:44px;height:44px;flex:none;border-radius:50%;color:var(--page-ink,#111)}

#tourPill .tour-pill-track{position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:1px;background:color-mix(in srgb,var(--page-ink,#111) 16%,transparent);pointer-events:none}
#tour.tour-listen .tour-page{bottom:calc(12px + var(--rfoot-h,96px) + 80px)}
#tourFinger{position:absolute;z-index:7;width:28px;height:28px;margin:-6px 0 0 -14px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none}
#tourFinger.tap{animation:tourTap .8s ease-out}
@keyframes tourTap{0%{transform:scale(1);opacity:1}40%{transform:scale(.72);opacity:1}100%{transform:scale(1);opacity:.4}}

.tour-pulse{animation:tourPulse .8s ease-out infinite}
.tour-pulse-once{animation:tourPulse .8s ease-out 1}
@keyframes tourPulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--pulse-rgb,80,120,255),.0)}50%{box-shadow:0 0 0 10px rgba(var(--pulse-rgb,80,120,255),.35)}}
#v-library .continue-hero.tour-pulse{animation:tourHeroPulse .8s ease-out infinite}
@keyframes tourHeroPulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--pulse-rgb,80,120,255),0)}50%{box-shadow:0 0 0 10px rgba(var(--pulse-rgb,80,120,255),.4)}}
#v-library.tour-grid-dim #docList .doc:not(.continue-hero){opacity:.45}
#docList [data-tour-hide]{display:none}

#tour.reduced *,#tour.reduced #tourCaption{animation:none !important;transition:none !important}

@media (prefers-reduced-motion: reduce){
  #tour *,#tour #tourCaption{animation:none !important;transition:none !important}
}

/* ---------- Styles (v37): Quiet, Paper, Lively ----------
   One app-wide Style sits on top of the page colour. Everything below is driven by custom properties set per
   [data-style] (on <html>, and on the Settings preview tiles). Styles change the app's chrome and motion only:
   the reading text, the reader bars and the read-aloud pill keep their sizes, so pages never change. */
[data-style="quiet"]{
  --paper:#E9EDF2; --surface:#FFFFFF; --raise:#F4F6F9; --ink:#15202D; --muted:#5A6779;
  --line:#CED6E0; --accent:#2244B5; --accent-soft:#DCE4FA; --accent-ink:#FFFFFF; --chip-ink:var(--accent); --fill-c:var(--accent);
  --accent-text:var(--accent); --accent-text-card:var(--accent); --sel-ink:var(--accent); --solid-dur:var(--motion-dur);
  --banner-bg:#1d4ed8; --banner-ink:#fff; /* v36's update banner */
  --ui-font:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* Quiet is v36's look exactly: v36 headings and spacing, and "initial" shapes so every rule below falls back to v36's own radius and shadow */
  --head-font:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --head-weight:800; --h2-weight:600;
  --radius-card:initial; --radius-btn:initial; --radius-sheet:initial;
  --shadow:initial; --btn-shadow:initial; --float-shadow:initial; --sheet-shadow:initial;
  --grain:none; --gap:14px;
  --motion-dur:200ms; --motion-ease:cubic-bezier(0,0,.2,1);
  --sheet-y:0%; --pop-y:0px; --pop-scale:1;
  --turn-dur:280ms; --turn-ease:cubic-bezier(.3,.6,.2,1); --turn-shade:0;
  --press-scale:1; --press-y:0px; --press-op:.55; --press-dur:140ms; --press-ease:ease-out;
}
[data-style="paper"]{
  --paper:#EFE8DB; --surface:#FBF8F1; --raise:#F4EEE2; --ink:#2A241D; --muted:#6C6357;
  /* tag text sits on the tan --accent-soft inside a faded card, so it takes a deeper brown (#633813, 4.9:1) to stay above 4.5:1 */
  --line:#E0D6C4; --accent:#8C5220; --accent-soft:#F1E1CC; --accent-ink:#FFFFFF; --chip-ink:#633813; --fill-c:var(--accent);
  --accent-text:var(--accent); --accent-text-card:var(--accent); --sel-ink:var(--accent); --solid-dur:160ms;
  --ui-font:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --head-font:"Iowan Old Style","Palatino","Literata",Georgia,serif; --head-weight:700;
  --radius-card:14px; --radius-btn:12px; --radius-sheet:18px;
  --shadow:0 1px 2px rgba(70,50,20,.08),0 4px 14px rgba(70,50,20,.08);
  --btn-shadow:0 1px 0 rgba(70,50,20,.10),0 2px 5px rgba(70,50,20,.12);
  --float-shadow:0 2px 4px rgba(70,50,20,.10),0 10px 28px rgba(70,50,20,.18);
  --sheet-shadow:0 -2px 6px rgba(70,50,20,.08),0 -12px 34px rgba(70,50,20,.16);
  /* paper grain: two offset dot lattices, very faint (no image files) */
  --grain:radial-gradient(rgba(90,64,30,.06) .6px,transparent .9px),radial-gradient(rgba(90,64,30,.04) .6px,transparent .9px);
  --gap:16px;
  --motion-dur:320ms; --motion-ease:cubic-bezier(.2,.7,.2,1);
  --sheet-y:32%; --pop-y:8px; --pop-scale:1;
  --turn-dur:320ms; --turn-ease:cubic-bezier(.2,.7,.2,1); --turn-shade:.16;
  --press-scale:1; --press-y:1px; --press-op:1; --press-dur:120ms; --press-ease:ease-out;
  /* the reader's active controls (scrubber, speaker, bookmark) and the tour pulse take Paper's brown instead of link blue */
  --chrome-on:var(--accent); --chrome-ink:var(--accent-ink); --pulse-rgb:140,82,32;
}
[data-style="lively"]{
  --paper:#F2F2F2; --surface:#FFFFFF; --raise:#F5F5F5; --ink:#141414; --muted:#626262;
  --line:#E3E3E3; --accent:#FF5A4E; --accent-soft:#EDEDED; --accent-ink:#1B1B1B; --chip-ink:var(--ink); --fill-c:var(--ink);
  /* one accent: coral #FF5A4E only fills, rings and icons; coral text is the darker #D63A2E (4.66:1 on white) and only sits on white
     surfaces; selected labels (active tab, chips, segments) are ink with a coral ring or icon. Only the primary action is a coral fill. */
  /* coral text (#D63A2E) reaches 4.5:1 only on white, so it is used on white cards (--accent-text-card) and ink elsewhere, incl. the grey groups inside sheets (--accent-text-raise) */
  --accent-text:var(--ink); --accent-text-card:#D63A2E; --accent-text-raise:var(--ink); --sel-ink:var(--ink); --solid-dur:120ms;
  --add-bg:transparent; --add-ink:var(--ink); --add-line:var(--ink);
  --ui-font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Atkinson Hyperlegible",sans-serif;
  --head-font:"Bricolage Grotesque",ui-rounded,"Avenir Next",system-ui,sans-serif; --head-weight:800;
  --radius-card:20px; --radius-btn:999px; --radius-sheet:26px;
  --shadow:0 2px 10px rgba(0,0,0,.06); --btn-shadow:none; --float-shadow:0 10px 30px rgba(0,0,0,.18); --sheet-shadow:0 -8px 30px rgba(0,0,0,.16);
  --grain:none; --gap:14px;
  --motion-dur:300ms; --motion-ease:cubic-bezier(.34,1.56,.64,1);
  --sheet-y:40%; --pop-y:12px; --pop-scale:.9;
  --turn-dur:260ms; --turn-ease:cubic-bezier(.2,.9,.3,1); --turn-shade:0;
  /* coral controls on the page (scrubber, active speaker/bookmark, the pill's Play fill) use the deeper #D63A2E on light pages:
     #FF5A4E is under 3:1 on Paper (2.83) and Sepia (2.44); #D63A2E is 3.7 / 4.28, and white Play glyph on it 4.66 */
  --chrome-on:#D63A2E; --chrome-ink:#FFFFFF; --play-bg:#D63A2E; --play-ink:#FFFFFF; --pulse-rgb:255,90,78;
  --press-scale:.96; --press-y:0px; --press-op:1; --press-dur:260ms; --press-ease:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="dark"][data-style="quiet"],:root[data-theme="dark"] [data-style="quiet"]{
  --paper:#0E1217; --surface:#171C23; --raise:#1E242C; --ink:#E4E9F0; --muted:#8D99A8;
  --line:#2B333D; --accent:#8AA4FF; --accent-soft:#232E4D; --accent-ink:#0E1217}
:root[data-theme="dark"][data-style="paper"],:root[data-theme="dark"] [data-style="paper"]{
  --paper:#15120E; --surface:#1F1B16; --raise:#28231D; --ink:#EDE5D8; --muted:#A79C8C;
  --line:#3A3229; --accent:#E2A76B; --accent-soft:#3A2C1D; --accent-ink:#15120E; --chip-ink:var(--accent); --chrome-on:var(--accent); --pulse-rgb:226,167,107;
  --grain:radial-gradient(rgba(255,240,215,.035) .6px,transparent .9px),radial-gradient(rgba(255,240,215,.025) .6px,transparent .9px)}
:root[data-theme="dark"][data-style="lively"],:root[data-theme="dark"] [data-style="lively"]{
  --paper:#0F0F0F; --surface:#1B1B1B; --raise:#242424; --ink:#F2F2F2; --muted:#9A9A9A;
  --line:#2E2E2E; --accent:#FF7A6E; --accent-soft:#2A2A2A; --accent-ink:#141414; --accent-text:#FF7A6E; --accent-text-card:#FF7A6E; --accent-text-raise:#FF7A6E; --chrome-on:var(--accent); --chrome-ink:var(--accent-ink); --play-bg:var(--accent); --play-ink:var(--accent-ink); --pulse-rgb:255,122,110}
/* every style collapses to a short fade when the phone asks for less motion */
@media (prefers-reduced-motion: reduce){
  :root,[data-style]{--motion-dur:160ms !important; --motion-ease:ease-out !important; --sheet-y:0% !important; --pop-y:0px !important; --pop-scale:1 !important;
    --press-scale:1 !important; --press-y:0px !important; --press-op:.6 !important; --turn-shade:0 !important}
}
:root{--f-ui:var(--ui-font); --f-display:var(--head-font); --fill:color-mix(in srgb,var(--fill-c,var(--accent)) 16%,var(--surface))}
h1{font-weight:var(--head-weight,800)}
h2{font-weight:var(--h2-weight,var(--head-weight,600))}
body,#sheet,.group{background-image:var(--grain,none);background-size:3px 3px,5px 5px;background-position:0 0,1px 2px}
.wrap{gap:var(--gap,14px)}
/* shapes: each fallback is v36's value, which Quiet keeps by setting the shape variables to initial */
.btn,.tbtn,.toc-tool{border-radius:var(--radius-btn,12px)}
.seg,.chip:not(.tagchips .chip),.input,textarea.input,select.input{border-radius:var(--radius-btn,10px)}
.fopt{border-radius:var(--radius-btn,8px)}
.doc,.group,.fsec,.addopt,.empty{border-radius:var(--radius-card,14px)}
.sortopt,#selMenu,#toast{border-radius:var(--radius-card,12px)}
.wn{border-radius:var(--radius-card,0)}
#v-library .continue-hero{border-radius:calc(var(--radius-card,14px) + 2px);box-shadow:var(--shadow,0 2px 10px rgba(0,0,0,.06))}
.doc,.group,.addopt{box-shadow:var(--shadow,none)}
.btn,.tbtn,.addopt,.sortopt,.toc-tool{box-shadow:var(--btn-shadow,none)}
#sheet{border-radius:var(--radius-sheet,18px) var(--radius-sheet,18px) 0 0;box-shadow:var(--sheet-shadow,0 -8px 30px rgba(0,0,0,.18))}
#selBar{border-radius:var(--radius-card,14px);box-shadow:var(--float-shadow,0 8px 28px rgba(0,0,0,.22))}
#selMenu{box-shadow:var(--float-shadow,0 8px 28px rgba(0,0,0,.22))}
.tag,.doc .tg span{color:var(--chip-ink)}
/* the reader's active controls (scrubber, bookmark, speaker, auto-scroll, play buttons, scroll line, bar hint, found word) use
   --chrome-on: Paper's brown or Lively's coral; Quiet leaves it unset and keeps the page's link colour. --chrome-ink is the glyph/text on a
   --chrome-on fill (Quiet: the page colour). */
#rScrub,#v-reader input[type=range]{accent-color:var(--chrome-on,var(--page-link))}
#rMark.on,#rTts.on{color:var(--chrome-on,var(--page-link))}
/* touch feedback: Quiet dims, Paper sinks 1px and loses its shadow, Lively squishes and springs back */
button,.doc{transition:scale var(--press-dur) var(--press-ease),translate var(--press-dur) var(--press-ease),opacity var(--press-dur) ease-out,box-shadow var(--press-dur) ease-out}
button:active:not(:disabled),.doc:active,.switch:active:not(:disabled){scale:var(--press-scale);translate:0 var(--press-y);opacity:var(--press-op)}
/* toggle switches answer a press in the Style too (their own colour/knob transitions stay) */
.switch{transition:background .15s,scale var(--press-dur) var(--press-ease),translate var(--press-dur) var(--press-ease),opacity var(--press-dur) ease-out}
.btn:active,.tbtn:active,.addopt:active,.sortopt:active,.toc-tool:active,.doc:active{box-shadow:none}
/* entrances: sheets settle in from the bottom; the pill, selection bar and tour cards pop in */
@keyframes st-sheet{from{opacity:0;translate:0 var(--sheet-y)}}
@keyframes st-pop{from{opacity:0;translate:0 var(--pop-y);scale:var(--pop-scale)}}
@keyframes st-fade{from{opacity:0}}
#sheet{animation:st-sheet var(--motion-dur) var(--motion-ease)}
#sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:var(--surface);pointer-events:none} /* covers the gap while a springy sheet overshoots */
#backdrop{animation:st-fade var(--motion-dur) ease-out}
/* closing: the sheet is already hidden (state, focus and taps move on at once); it only fades out on screen for 120ms */
#sheet[hidden].closing{display:flex!important}
#backdrop[hidden].closing{display:block!important}
#sheet.closing,#backdrop.closing{pointer-events:none;animation:st-close 120ms ease-in forwards}
@keyframes st-close{from{opacity:1}to{opacity:0}}
#ttsBar,#tourCaption.st-in{animation:st-pop var(--motion-dur) var(--motion-ease)}
/* the toast, back-to-place pill, selection More menu and update banner enter in the Style too (placement uses stillRect / offset sizes) */
#toast,#backPill,#selMenu,#swUpdate{animation:st-pop var(--motion-dur) var(--motion-ease)}
/* Lively's one accent also tints the native word-selection highlight */
[data-style="lively"] ::selection{background:color-mix(in srgb,var(--accent) 32%,transparent)}
/* the selection bar springs like the pill but turns solid at once, so the page and info line never show through it */
#selBar{animation:st-rise var(--motion-dur) var(--motion-ease),st-fade var(--solid-dur,var(--motion-dur)) ease-out}
@keyframes st-rise{from{translate:0 var(--pop-y);scale:var(--pop-scale)}}
#v-library .continue-hero{animation:st-fade var(--motion-dur) ease-out}
/* with a Continue card on the shelf, Continue is the one primary action; Add to library follows the Style (Lively: ink outline) */
#v-library:has(.continue-hero) #addBtn{background:var(--add-bg,var(--accent));color:var(--add-ink,var(--accent-ink));border-color:var(--add-line,var(--accent))}
/* Pages-mode page turn: a soft shadow along the incoming edge (only where the style gives it a shade) */
#pgClip::after{content:"";position:absolute;top:0;bottom:0;width:28px;right:0;pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(to left,rgba(40,25,5,var(--turn-shade,0)),transparent)}
#pgClip.turn-back::after{right:auto;left:0;background:linear-gradient(to right,rgba(40,25,5,var(--turn-shade,0)),transparent)}
#pgClip.turning::after{animation:st-edge var(--turn-dur) var(--turn-ease)}
@keyframes st-edge{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
/* applying a style: a short crossfade (used when the browser has no view transitions) */
:root.style-xfade *{transition:background-color 250ms ease,color 250ms ease,border-color 250ms ease,box-shadow 250ms ease,border-radius 250ms ease !important}
::view-transition-old(root),::view-transition-new(root){animation-duration:250ms;animation-timing-function:ease}
/* ---------- the Guide (v39): one accent blob where you look or tap next ----------
   Motion per Style lives here only; l_guide.js reads these variables and has no per-Style code. */
[data-style="quiet"]{--guide-dur:350ms; --guide-ease:cubic-bezier(.4,0,.2,1); --guide-stretch:.08; --guide-squish:0; --guide-tail:.03}
[data-style="paper"]{--guide-dur:440ms; --guide-ease:cubic-bezier(.2,.7,.2,1); --guide-stretch:.2; --guide-squish:0; --guide-tail:.07}
[data-style="lively"]{--guide-dur:520ms; --guide-ease:cubic-bezier(.34,1.56,.64,1); --guide-stretch:.55; --guide-squish:.2; --guide-tail:.1;
  --guide-mark:var(--chrome-on,var(--accent))} /* the resting mark on a light page keeps 3:1 like the other coral controls */
:root{--guide-size:26px; --guide-fly:1; --guide-fade:160ms}
@media (prefers-reduced-motion: reduce){ :root,[data-style]{--guide-fly:0 !important} }
#guide{position:fixed;inset:0;z-index:20001;pointer-events:none;overflow:hidden;contain:strict;transition:opacity 160ms ease-out}
#guide .gpos{position:absolute;left:0;top:0;width:26px;height:26px;will-change:transform;pointer-events:none}
#guide .gbody{position:absolute;inset:0;display:block;border-radius:50%;background:var(--accent);opacity:0;will-change:transform,opacity;transform-origin:50% 50%}
#guide .gshape .gbody{background:var(--guide-mark,var(--accent))}
#guide .gsplit .gbody{background:var(--guide-mark,var(--accent))}
/* while the blob is on its way, the button it left or is heading for shows no fill of its own (one accent blob only) */
.guide-off{background-color:transparent !important;border-color:color-mix(in srgb,currentColor 22%,transparent) !important;box-shadow:none !important;color:var(--muted) !important}
#v-reader .guide-off,#tour .guide-off{color:var(--page-muted,var(--muted)) !important}
/* it steps aside under anything that sits on top of the screen */
body:has(#sheet:not([hidden])) #guide,body:has(#selBar:not([hidden])) #guide,body:has(#imgOverlay) #guide{opacity:0}
/* Settings: the Style picker */
.stylepick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 4px}
.stile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.stile .mini{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--tile-bg);color:var(--tile-ink);
  border-radius:var(--radius-card,14px);box-shadow:var(--shadow,0 0 #0000),0 0 0 1px var(--line);background-image:var(--grain,none);background-size:3px 3px,5px 5px;
  display:flex;flex-direction:column;gap:5px;padding:10px 9px;text-align:left;font-family:var(--ui-font)}
.stile .mini b{font-family:var(--head-font);font-weight:var(--head-weight);font-size:1rem;line-height:1.1;letter-spacing:-.01em}
.stile .mini i{display:block;height:3px;border-radius:2px;background:currentColor;opacity:.18}
.stile .mini i.s{width:62%}
.stile .mini .mbtn{align-self:flex-start;margin-top:3px;height:12px;width:38%;border-radius:var(--radius-btn,12px);background:var(--accent);box-shadow:var(--btn-shadow,none)}
.stile .mini .msheet{position:absolute;left:5px;right:5px;bottom:0;height:24%;background:color-mix(in srgb,var(--tile-bg) 55%,#fff);border-radius:calc(var(--radius-card,14px)*.6) calc(var(--radius-card,14px)*.6) 0 0;box-shadow:var(--sheet-shadow,0 -3px 10px rgba(0,0,0,.12)),0 0 0 1px color-mix(in srgb,var(--tile-ink) 10%,transparent)}
.stile .mini .msheet::before{content:"";display:block;width:22%;height:3px;border-radius:2px;background:color-mix(in srgb,var(--tile-ink) 25%,transparent);margin:5px auto 0}
.stile.play .mini .msheet{animation:st-sheet var(--motion-dur) var(--motion-ease)}
.stile.play .mini .mbtn{animation:st-press calc(var(--press-dur) * 2) var(--press-ease)}
@keyframes st-press{50%{scale:var(--press-scale);translate:0 var(--press-y);opacity:var(--press-op);box-shadow:none}}
/* reduced motion: these come after every main definition so they win */
@media (prefers-reduced-motion: reduce){ @keyframes st-sheet{from{opacity:0}} @keyframes st-pop{from{opacity:0}} @keyframes st-rise{from{opacity:1}} @keyframes st-press{50%{opacity:var(--press-op)}} }
.stile .cap{font-size:min(.78rem,3.1vw);color:var(--muted);text-align:center;line-height:1.25;white-space:nowrap}
.stile .nm{font-size:.86rem;font-weight:700}
.stile[aria-checked="true"] .mini{box-shadow:var(--shadow,0 0 #0000),0 0 0 2.5px var(--accent)}
.stile .scheck{position:absolute;top:-7px;right:-7px;left:auto;margin:0;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--surface);display:none;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.stile[aria-checked="true"] .scheck{display:flex}
.stile .mini b{padding-right:12px} /* the title stays clear of the check badge in the corner */

</style>
</head>
