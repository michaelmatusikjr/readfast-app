<style>
/* Layout: one-screen phone app. Library-level views scroll above a tab bar; the reader is a full-bleed page
   with thin top and bottom control bars that fade away in focus mode. */
[hidden]:not([hidden=until-found i]){display:none!important}
:root{
  --paper:#E9EDF2; --surface:#FFFFFF; --raise:#F4F6F9; --ink:#15202D; --muted:#5A6779;
  --line:#CED6E0; --accent:#2244B5; --accent-soft:#DCE4FA; --accent-ink:#FFFFFF; --danger:#B3262F;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --focus:#E0303F; --rfont:var(--f-ui); --rsize:44px;
  --img-bg:#FFFFFF; /* book art is drawn for white pages, so images keep a white ground in every theme */
  /* page (reader) tokens: JS sets these from the chosen reading theme */
  --page-bg:#FFFFFF; --page-ink:#1B1B1B; --page-muted:#6B6B6B; --page-line:#E2E2E2; --page-link:#2456C7;
  --hl1:#FFE58A; --hl2:#C4EDB5; --hl3:#C5E1FF; --hl4:#FFC9DF; --tts:#FFD54A;
  --bfont:"Literata",Georgia,serif; --bsize:19px; --blh:1.55; --mx:24px; --pgap:.6em; --pind:0; --balign:left; --hyph:manual; --bw:400; --bwb:700;
}
:root[data-theme="dark"]{
  --paper:#0E1217; --surface:#171C23; --raise:#1E242C; --ink:#E4E9F0; --muted:#8D99A8;
  --line:#2B333D; --accent:#8AA4FF; --accent-soft:#232E4D; --accent-ink:#0E1217; --danger:#FF7A82; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;touch-action:pan-x pan-y} /* no pinch or double-tap zoom of the app; pictures have their own zoom */
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{overflow:hidden}
#app{position:fixed;inset:0;height:auto;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.15rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;cursor:pointer;color:inherit;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:rgba(127,127,127,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}

/* Library */
#libTools{display:flex;flex-direction:column;gap:10px;width:100%}
.libbar{display:flex;gap:8px;align-items:center}
#libFind{flex:1;min-width:0;box-sizing:border-box}
.tbtn{flex:none;position:relative;width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbtn.on{border-color:var(--accent);color:var(--accent)}
.tbtn .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--surface);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
#libSug,#libPills{gap:6px}
.tagchips .chip{padding:5px 10px;font-size:.82rem;border-radius:999px}
/* filter colors: status, title, author, tag */
.pill{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);max-width:100%}
.pill .x{font-size:.7rem;opacity:.75;color:var(--c)}
.pill .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c);font-weight:700}
.pill span.v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-st{--c:#2f9e6e}.f-ti{--c:#3a6fd8}.f-au{--c:#c47a12}.f-tg{--c:#9b4dca}
.pill.clear{--c:var(--muted);font-weight:500}
.pill.ftpill{--c:var(--ink)}
button.hlrow.ftrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.ftrow mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.wn-i{padding:10px 0;border-bottom:1px solid var(--line)}.wn-i:last-child{border:0}.wn-i .small{margin-top:3px;line-height:1.45}
.wn{margin-bottom:14px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
details.yr{margin-top:10px}
.fsec{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.fsec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700}
.fsec summary::-webkit-details-marker{display:none}
.fsec summary .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.fsec summary .n{margin-left:auto;font-weight:500;color:var(--muted);font-size:.85rem}
.fsec summary .chev{transition:transform .15s;color:var(--muted)}
.fsec[open] summary .chev{transform:rotate(90deg)}
.fsec .fin{margin:0 12px 8px;width:calc(100% - 24px);box-sizing:border-box}
.fsec .fopts{max-height:260px;overflow:auto;padding:0 6px 8px}
.fopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 8px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;border-radius:8px}
.fopt .bx{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--surface)}
.fopt[aria-pressed=true] .bx{background:var(--c);border-color:var(--c)}
.fopt .lb{flex:1;min-width:0}.fopt .ct{color:var(--muted);font-size:.8rem}
.sortopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left}
.sortopt[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.grp{margin:10px 2px -2px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.grp span{font-weight:400;letter-spacing:0}
.doc .a{grid-column:1;font-size:.9rem;color:var(--ink);opacity:.8;margin-top:-2px}
.doc .tg{grid-column:1;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.doc .tg span{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagchips .chip .x{margin-left:6px;opacity:.6}
.addopt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.addopt svg{flex:none;width:26px;height:26px;color:var(--accent)}
.addopt b{display:block;font-size:1rem}.addopt small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
:root{--fill:color-mix(in srgb, var(--accent) 16%, var(--surface))}
.doc{background:linear-gradient(90deg,var(--fill) 0,var(--fill) var(--p,0%),var(--surface) var(--p,0%)) !important}
/* OpenDyslexic (SIL Open Font License) ships with the app so it works offline */
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url('fonts/OpenDyslexic-Bold-Italic.woff2') format('woff2');font-weight:700;font-style:italic;font-display:swap}
 /* on touch screens Tooz does its own selection in a book, so the phone's Copy / Look Up menu stays out of the way */
@media (hover:none),(pointer:coarse){ #pagesView,#scFlow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} }
.book w.tsel,.book wd.tsel{--hc:color-mix(in srgb,var(--accent) 32%,transparent)}
.tsdrag #selBar{opacity:0;pointer-events:none}
.tsh{position:fixed;z-index:13;width:32px;height:calc(var(--stem,22px) + 16px);margin-left:-16px;touch-action:none;cursor:grab}
.tsh::before{content:"";position:absolute;left:15px;width:2px;height:var(--stem,22px);background:var(--accent)}
.tsh::after{content:"";position:absolute;left:9px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
#tsA::after{top:0} #tsA::before{top:13px}
#tsB::before{top:0} #tsB::after{top:calc(var(--stem,22px) - 1px)}
.qcard-prev{width:100%;max-width:360px;aspect-ratio:1;display:block;margin:0 auto 12px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.tdet{margin-top:12px}
.tdet summary{cursor:pointer;color:var(--muted);font-size:.85rem;list-style:none;display:flex;align-items:center;gap:6px}
.tdet summary::-webkit-details-marker{display:none}
.tdet summary::before{content:"›";display:inline-block;transition:transform .15s}
.tdet[open] summary::before{transform:rotate(90deg)}
.tdet summary span{opacity:.75}
#tagSet .tdet{margin-top:0}#tagSet .tdet summary{font-size:.95rem;color:var(--ink);font-weight:600;padding:2px 0}
#tagSet .tdet .list{margin-top:10px}
.book w.nb{color:var(--link,var(--accent));text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.stars{display:flex;gap:4px;margin-top:4px}
.stars button{font-size:2rem;line-height:1;background:none;border:0;color:var(--accent);padding:2px 4px;cursor:pointer}
.winner .wdel{flex:none;align-self:center;color:var(--muted)}
.winner .wdel:hover{color:var(--danger)}
.hint-touch{display:inline}.hint-mouse{display:none}
@media (hover:hover) and (pointer:fine){ .hint-touch{display:none}.hint-mouse{display:inline} }
/* only a book's own text can be selected */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],#pagesView,#scFlow,.lookup,#sheet .quote{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.doc{display:grid;grid-template-columns:1fr auto;gap:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px 14px 16px;cursor:pointer;text-align:left}
.doc .t{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.doc .m{grid-column:1;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.doc .bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--raise);overflow:hidden;margin-top:6px;margin-right:8px}
.doc .bar i{display:block;height:100%;background:var(--accent)}
.doc .more{grid-row:1/3;grid-column:2;align-self:center}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Tabs */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
#tabs button{border:0;background:none;padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;min-height:56px}
#tabs button svg{width:22px;height:22px}
#tabs button[aria-current="page"]{color:var(--accent)}

/* ---------- Reader frame ---------- */
#v-reader{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--page-bg);color:var(--page-ink)}
.rchrome{flex:none;transition:opacity .2s ease;background:var(--page-bg);position:relative;z-index:5}
#v-reader.chrome-off .rchrome{opacity:0;pointer-events:none}
#rTop{display:flex;align-items:center;gap:0;padding:2px max(4px,env(safe-area-inset-right,0px)) 2px max(4px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--page-line)}
#rTop .title{flex:1;min-width:0;text-align:center;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;line-height:1.25}
#rTop .sub{display:block;font-weight:400;font-size:.75rem;color:var(--page-muted);overflow:hidden;text-overflow:ellipsis}
#rAa{font-family:Georgia,serif;font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
#rBody{flex:1;min-height:0;position:relative;overflow:hidden}
#rFoot{display:flex;flex-direction:column;gap:4px;padding:8px max(8px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-top:1px solid var(--page-line)}
#v-reader[data-mode="speed"] #rFoot{display:none}
.rfoot-row{display:flex;align-items:center;gap:4px}
.rfoot-row .info{flex:1;min-width:0;border:0;background:none;color:var(--page-muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:6px 2px}
#rScrub{accent-color:var(--page-link)}
#rMark.on svg path{fill:currentColor}
#rMark.on{color:var(--page-link)}
#rTts.on{color:var(--page-link)}
.run{position:absolute;left:0;right:0;z-index:4;text-align:center;font-size:.72rem;color:var(--page-muted);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 56px;font-variant-numeric:tabular-nums}
#runHead{top:16px}
#runFoot{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#v-reader input[type=range]{accent-color:var(--page-link)}
#v-reader.chrome-off .run{opacity:1}
#v-reader[data-mode="speed"] .run{display:none}

/* Auto-scroll bar */
#asBar{display:flex;align-items:center;gap:4px}
#ttsBar{display:flex;align-items:center;gap:2px}
#ttsHint{font-size:.8rem;color:var(--page-muted);text-align:center;padding:2px 0 4px}
#ttsBar[hidden]{display:none}
#ttsBar .icon-btn{width:38px;height:40px;flex:none}
#ttsBar .icon-btn.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink,#fff)}
#ttsBar input[type=range]{flex:1;min-width:50px}
#ttsLabel{font-family:var(--f-mono);font-size:.82rem;min-width:3.2em;text-align:right;color:var(--page-ink);font-variant-numeric:tabular-nums}
.book w.ttspick{box-shadow:inset 0 -2px 0 var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:2px}
#asBar .icon-btn{width:40px;height:40px}
#asPlay{background:var(--page-link);color:var(--page-bg);border-radius:50%}
#asLabel{font-family:var(--f-mono);font-size:.82rem;min-width:5.4em;text-align:right;color:var(--page-ink);font-variant-numeric:tabular-nums}
#asLabel small{color:var(--page-muted);font-weight:500}

/* ---------- Book text (shared by Pages and Scroll) ---------- */
.book{font-family:var(--bfont);font-size:var(--bsize);line-height:var(--blh);color:var(--page-ink);font-weight:var(--bw);text-align:var(--balign);-webkit-hyphens:var(--hyph);hyphens:var(--hyph);overflow-wrap:break-word;-webkit-text-size-adjust:100%;font-kerning:normal;text-rendering:optimizeLegibility}
.book p{margin:0;text-indent:var(--pind);orphans:2;widows:2}
.book p+p{margin-top:var(--pgap)}
.book h1,.book h2,.book h3,.book h4,.book h5,.book h6{font-family:inherit;font-weight:var(--bwb);line-height:1.25;margin:1.1em 0 .7em;text-indent:0;text-align:center;letter-spacing:0;text-wrap:balance;break-after:avoid;-webkit-hyphens:manual;hyphens:manual}
.book .hl{text-align:left}
.book h1{font-size:1.5em}.book h2{font-size:1.32em}.book h3{font-size:1.15em}.book h4,.book h5,.book h6{font-size:1em}
.book .sec>:first-child{margin-top:.2em}
.book p.bli{padding-left:1.3em;text-indent:0;position:relative;margin-top:.35em}
.book p.bli::before{content:"•";position:absolute;left:.35em;color:var(--page-muted)}
.book p.pre{font-family:var(--f-mono);font-size:.82em;white-space:pre-wrap;text-indent:0;text-align:left;-webkit-hyphens:manual;hyphens:manual}
.book p.gap{margin-top:1.2em}
.book p.cap{font-size:.86em;color:var(--page-muted);text-align:center;text-indent:0}
.book .bq{margin-left:.6em;padding-left:.9em;border-left:3px solid var(--page-line)}
.book figure{margin:.9em 0;text-align:center;break-inside:avoid}
.book figure img{max-width:100%;max-height:calc(var(--pageH,80vh) - 1.5em);height:auto;object-fit:contain;border-radius:4px;background:var(--img-bg);cursor:zoom-in;vertical-align:top}
.book hr.brk{border:0;margin:1em 0;text-align:center;height:1.2em}
.book hr.brk::after{content:"⁂";color:var(--page-muted)}
w{cursor:text}
w.i,wd.i{font-style:italic} w.b,wd.b{font-weight:var(--bwb)} w.c{font-family:var(--f-mono);font-size:.86em} w.u{text-decoration:underline}
w.p,w.s{font-size:.7em;line-height:0} w.p{vertical-align:super} w.s{vertical-align:sub}
w.n{color:var(--page-link);font-size:.72em;vertical-align:super;line-height:0;cursor:pointer;padding:0 .12em;font-weight:var(--bwb)}
b.ws{font-weight:var(--bwb)}
w.hl1,wd.hl1{--hc:var(--hl1)} w.hl2,wd.hl2{--hc:var(--hl2)} w.hl3,wd.hl3{--hc:var(--hl3)} w.hl4,wd.hl4{--hc:var(--hl4)}
